<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Szpakowski design</title>
  <link rel="canonical" href="https://janszpakowski.pl/">
  <meta name="description" content="Jan Szpakowski — product designer, brand builder and design leader.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,400;0,500;1,400&family=Manrope:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script>(function(){try{var t=localStorage.getItem('theme');if(t==='dark'||t==='light'){document.documentElement.setAttribute('data-theme',t);}}catch(e){}})();</script>
</head>
<body>
  <header class="app-header">
    <a class="logo" href="./"><span class="logo-name">Szpakowski</span><span class="logo-suffix">design</span></a>
    <nav class="nav" id="site-nav">
      <a href="projects">projects</a>
      <a href="about">about</a>
      <a href="contact">contact</a>
    </nav>
    <div class="header-controls">
      <button class="theme-toggle" type="button" aria-label="Switch to dark theme" aria-pressed="false">
        <svg class="icon-sun" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
        <svg class="icon-moon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3a7 7 0 0 0 9.79 9.79z"/></svg>
      </button>
      <button class="nav-toggle" type="button" aria-label="Open menu" aria-expanded="false" aria-controls="site-nav">
        <svg class="icon-menu" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
        <svg class="icon-close" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>
  </header>

  <main class="content content--home">
    <h1>Hello, I <span class="accent">design</span> products, <span class="accent">build</span> brands, and <span class="accent">lead</span> a design team. I spend most of my time turning <span class="accent">complex</span> problems into <span class="accent">simple</span> solutions.</h1>

    <div class="home-projects">
      <ul class="projects-list projects-list--home">
        <li class="project-card">
          <a href="project-halo">
            <span class="thumb-frame"><img class="thumb" src="assets/thumb-halo.jpg" alt="Halo — decision intelligence platform"></span>
            <div class="body"><span class="name">Halo interface</span></div>
          </a>
        </li>
        <li class="project-card">
          <a href="project-halo-branding">
            <span class="thumb-frame"><img class="thumb" src="assets/thumb-halo-branding.png" alt="Halo brand mark"></span>
            <div class="body"><span class="name">Halo Branding</span></div>
          </a>
        </li>
        <li class="project-card">
          <a href="project-data-visualization">
            <span class="thumb-frame"><img class="thumb" src="assets/thumb-data-visualization.jpg" alt="Interactive data visualisation"></span>
            <div class="body"><span class="name">Data visualisation</span></div>
          </a>
        </li>
        <li class="project-card project-card--tablet-only">
          <a href="project-leadership">
            <span class="thumb-frame"><img class="thumb" src="assets/thumb-leadership.png" alt="Design team leadership"></span>
            <div class="body"><span class="name">Design team leadership</span></div>
          </a>
        </li>
      </ul>

      <div class="cta-row">
        <a class="cta-link" href="projects">More of my work →</a>
      </div>
    </div>
  </main>

  <script src="script.js"></script>
  <script data-goatcounter="https://janszpakowski.goatcounter.com/count"
          async src="//gc.zgo.at/count.js"></script>
</body>
</html>
